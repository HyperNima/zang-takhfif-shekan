name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate extension files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS syntax check (node --check)
        run: |
          set -e
          for f in background.js content.js; do
            node --check "$f"
            echo "✔ $f OK"
          done

      - name: Validate manifest.json
        run: node scripts/validate-manifest.mjs